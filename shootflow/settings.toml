# language: ini
# settings.ini (place at repo root or a config/ folder — see config.py below)
[default]
AWS_REGION = "us-east-1"
DDB_TABLE = "shootflow-db"
S3_BUCKET = "bucket"
LOG_LEVEL = "INFO"

FLICKR_SECRET_NAME = "FLICKR-API"
FLICKR_UPLOAD_TIMEOUT_SECONDS = 120
FLICKR_UPLOAD_MAX_RETRIES = 1
FLICKR_UPLOAD_BACKOFF_SECONDS = 2.0
FLICKR_UPLOAD_PUBLIC = true

FLICKR_SCORE_REFRESH_DRY_RUN = false

# Flickr score hyperparameters
FLICKR_SCORE_W_FAV = 3.0
FLICKR_SCORE_W_COM = 4.0
FLICKR_SCORE_W_VIEW = 1.0
FLICKR_SCORE_BAYES_ALPHA = 5.0
FLICKR_SCORE_BAYES_BETA = 200.0
FLICKR_SCORE_HALF_LIFE_HOURS = 8760.0
FLICKR_SCORE_SCALE = 1000.0

# LLM-based group suggestion configuration
FLICKR_GROUPS_VIA_LLM_ENABLED = true
FLICKR_GROUPS_DRY_RUN_ENABLED = false

# Optional: static fallback/bypass group IDs; if non-empty, LLM selection is skipped
FLICKR_STATIC_GROUP_IDS = []
# Always-include group IDs (appended after LLM/static suggestions, de-duped)
FLICKR_INCLUDE_GROUP_IDS = []
# Exclude/blocklist group IDs (filtered out from suggestions)
FLICKR_EXCLUDE_GROUP_IDS = ["14944275@N22"]
OPENAI_BASE_URL = "https://api.openai.com/v1"
OPENAI_CHAT_MODEL = "gpt-5-mini"
OPENAI_SECRET_NAME = "OPENAI-API"

LLM_MAX_GROUPS = 15
LLM_MAX_CANDIDATE_GROUPS = 400
LLM_HTTP_CONNECT_TIMEOUT_SECONDS = 10.0
LLM_HTTP_READ_TIMEOUT_SECONDS = 120.0
LLM_HTTP_RETRIES = 3
LLM_HTTP_BACKOFF_BASE_SECONDS = 1.5
LLM_GROUP_NAME_MAX_LEN = 120
LLM_GROUP_DESC_MAX_LEN = 1000
LLM_TITLE_MAX_LEN = 200
LLM_CAPTION_MAX_LEN = 800

# LLM debugging and dashboard correlation
# When true, logs the system message and user payload for the LLM request (redacting secrets)
LLM_LOG_PROMPT = false
# Optional user tag sent to OpenAI's chat.completions "user" field for dashboard attribution
OPENAI_USER_TAG = "shootflow"

EXIF_BLOCKLIST = []
EXIF_MAX_TEXT_LENGTH = 20000
EXIF_BASE64_SNIFF_PREFIX_LEN = 200
EXIF_LARGE_COLLECTION_SIZE = 2000

S3_INGEST_DRY_RUN = true
S3_INGEST_STATUS_READY = "READY"
S3_INGEST_PARTITION_PREFIX = "PHOTO#"
S3_INGEST_SORT_KEY_METADATA = "METADATA"
S3_INGEST_READY_PREFIX = "ready/"

[unittest]
# overrides for Unit Tests

[development]
# overrides for dev
FLICKR_GROUPS_DRY_RUN_ENABLED = true
FLICKR_UPLOAD_PUBLIC = false
DDB_TABLE = "shootflow-photo-metadata-development"
S3_BUCKET = "shootflowupload-development"
LLM_LOG_PROMPT = false
LOG_LEVEL = "INFO"

[production]
# Production-specific overrides (if any)
DDB_TABLE = "shootflow-photo-metadata-production"
S3_BUCKET = "shootflowupload-production"

