[tool.poetry]
name = "shootflow-services"
version = "0.1.0"
description = "Shootflow Services Code"
authors = ["Corey Leopold <cleopold73@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
  { include = "shootflow" }
]

[tool.poetry.dependencies]
python = "^3.10"
boto3 = "^1.40.5"
dynaconf = "^3.2.11"
pytest = "^8.4.1"
pyexiftool = "^0.5.6"
flickr-api = "^0.7.7"
coverage = "^7.10.4"
typer = {version = "^0.12.5", extras = ["all"]}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
sf-instagram = "shootflow.tools.get_instagram:main"
sf = "shootflow.cli:app"
