name: Deploy Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ECR_REPOSITORY: shootflow-ecr-repo
  IMAGE_TAG: ${{ github.sha }}
  EXIFTOOL_VERSION: '13.30'  # Single source of truth
  PYTHON_VERSION: '3.10'     # Single source of truth for Python
  AWS_REGION: us-east-1      # single source of truth for region

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install cpanminus and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus make

      - name: Install ExifTool (pinned)
        run: |
          sudo cpanm --notest --no-man-pages Image::ExifTool@${{ env.EXIFTOOL_VERSION }}

      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath

      - name: Install Poetry
        run: |
          pipx install poetry==1.8.4

      - name: Install dependencies (with dev)
        run: poetry install --no-interaction --no-ansi

      - name: Run unit tests
        run: poetry run pytest -q

  build:
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::477763023369:role/ShootflowInfraStack-ShootflowEcrPublishRoleD613A83B-ck4os4eAt1k0
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath

      - name: Install Poetry
        run: |
          pipx install poetry==1.8.4

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Build wheel
        run: poetry build -f wheel

      - name: Determine wheel filename
        id: wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.whl)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected exactly 1 wheel in dist/, found ${#files[@]}: ${files[*]-<none>}" >&2
            exit 1
          fi
          WHEEL_FILE="$(basename "${files[0]}")"
          echo "WHEEL_FILE=${WHEEL_FILE}" | tee -a "$GITHUB_ENV"
          echo "wheel_file=${WHEEL_FILE}" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # Set the platform to match your Lambda architecture:
          # - For x86_64 Lambda: linux/amd64
          # - For arm64 Lambda:  linux/arm64
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:shootflow-services-${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:shootflow-services-latest
          build-args: |
            WHEEL_FILE=${{ env.WHEEL_FILE }}
            EXIFTOOL_VERSION=${{ env.EXIFTOOL_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          # Force Docker schema 2 media types and gzip compression
          provenance: false
          sbom: false
          outputs: type=registry,oci-mediatypes=false,compression=gzip,force-compression=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-infra:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (for account ID)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::477763023369:role/ShootflowInfraStack-ShootflowEcrPublishRoleD613A83B-ck4os4eAt1k0
          aws-region: ${{ env.AWS_REGION }}

      - name: Compute immutable IMAGE_URI from digest
        id: compute-image-uri
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ env.AWS_REGION }}"
          REPO="${{ env.ECR_REPOSITORY }}"
          DIGEST="${{ needs.build.outputs.image-digest }}"
          if [[ -z "$DIGEST" ]]; then
            echo "Image digest not available from build job." >&2
            exit 1
          fi
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
          IMAGE_URI="${REGISTRY}/${REPO}@${DIGEST}"
          echo "IMAGE_URI=${IMAGE_URI}" | tee -a "$GITHUB_ENV"

      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: cleopold73/shootflow-infra
          token: ${{ secrets.INFRA_REPO_PAT }}
          ref: main
          path: infra-repo

      - name: Update image URI file
        shell: bash
        working-directory: infra-repo
        run: |
          set -euo pipefail
          mkdir -p shootflow_infra
          printf "%s\n" "${IMAGE_URI}" > shootflow_infra/image_uri.txt
          echo "Wrote IMAGE_URI to shootflow_infra/image_uri.txt"

      - name: Commit and push update to infra repo
        shell: bash
        working-directory: infra-repo
        env:
          CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Mask the 12-digit AWS account ID at the start of the IMAGE_URI for the commit message
          MASKED_IMAGE_URI="$(echo "${IMAGE_URI}" | sed -E 's#^[0-9]{12}#************#')"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add shootflow_infra/image_uri.txt
            git commit -m "chore: update image_uri.txt to ${MASKED_IMAGE_URI} (source: ${CI_COMMIT_SHA})"
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi