name: Deploy Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ECR_REPOSITORY: shootflow-ecr-repo
  IMAGE_TAG: ${{ github.sha }}
  EXIFTOOL_VERSION: '13.30'  # Single source of truth
  PYTHON_VERSION: '3.10'     # Single source of truth for Python

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install cpanminus and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus make

      - name: Install ExifTool (pinned)
        run: |
          sudo cpanm --notest --no-man-pages Image::ExifTool@${{ env.EXIFTOOL_VERSION }}

      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath

      - name: Install Poetry
        run: |
          pipx install poetry==1.8.4

      - name: Install dependencies (with dev)
        run: poetry install --no-interaction --no-ansi

      - name: Run unit tests
        run: poetry run pytest -q

  build:
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      ecr-registry: ${{ steps.login-ecr.outputs.registry }}
      image-digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::477763023369:role/ShootflowInfraStack-ShootflowEcrPublishRoleD613A83B-ck4os4eAt1k0
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pipx
        run: |
          python3 -m pip install --user pipx
          python3 -m pipx ensurepath

      - name: Install Poetry
        run: |
          pipx install poetry==1.8.4

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Build wheel
        run: poetry build -f wheel

      - name: Determine wheel filename
        id: wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.whl)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected exactly 1 wheel in dist/, found ${#files[@]}: ${files[*]-<none>}" >&2
            exit 1
          fi
          WHEEL_FILE="$(basename "${files[0]}")"
          echo "WHEEL_FILE=${WHEEL_FILE}" | tee -a "$GITHUB_ENV"
          echo "wheel_file=${WHEEL_FILE}" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:shootflow-services-${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:shootflow-services-latest
          build-args: |
            WHEEL_FILE=${{ env.WHEEL_FILE }}
            EXIFTOOL_VERSION=${{ env.EXIFTOOL_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-infra:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Compute immutable IMAGE_URI
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY="${{ needs.build.outputs.ecr-registry }}"
          REPO="${{ env.ECR_REPOSITORY }}"
          DIGEST="${{ needs.build.outputs.image-digest }}"
          if [[ -z "$REGISTRY" || -z "$DIGEST" ]]; then
            echo "Registry or digest not available from build job." >&2
            exit 1
          fi
          echo "IMAGE_URI=${REGISTRY}/${REPO}@${DIGEST}" | tee -a "$GITHUB_ENV"

      - name: Trigger infra deployment workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_PAT }}   # Fine-scoped token or GitHub App installation token
          repository: cleopold73/shootflow-infra
          event-type: deploy-lambda
          client-payload: |
            {
              "image_uri": "${{ env.IMAGE_URI }}",
              "service": "shootflow-services",
              "commit": "${{ github.sha }}",
              "environment": "prod"
            }